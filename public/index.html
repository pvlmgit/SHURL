<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shurl</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 40px 0 30px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1d1d1f;
    }

    header p {
      font-size: 15px;
      color: #86868b;
      margin-top: 4px;
    }

    .input-group {
      background: #fff;
      border-radius: 16px;
      padding: 4px;
      display: flex;
      gap: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03);
      margin-bottom: 16px;
    }

    .input-group input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-size: 16px;
      background: transparent;
      color: #1d1d1f;
      font-family: inherit;
    }

    .input-group input::placeholder { color: #c7c7cc; }

    .input-group button {
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .input-group button:hover { background: #0077ed; }
    .input-group button:active { background: #006edb; transform: scale(0.98); }

    .result-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.show { display: block; }

    .result-url {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #f5f5f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .result-url a {
      font-size: 17px;
      font-weight: 600;
      color: #0071e3;
      text-decoration: none;
      word-break: break-all;
      line-height: 1.3;
      text-align: center;
    }

    .result-url a:hover { text-decoration: underline; }

    .btn-copy {
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-copy:hover { background: #0077ed; }
    .btn-copy:active { transform: scale(0.96); }
    .btn-copy.copied { background: #34c759; }

    .qr-section {
      text-align: center;
      padding-top: 8px;
    }

    .qr-section img {
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .qr-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-secondary:hover { background: #e8e8ed; }
    .btn-secondary:active { transform: scale(0.96); }
    .btn-secondary svg { width: 16px; height: 16px; }

    .loading {
      text-align: center;
      padding: 20px;
      color: #86868b;
      font-size: 15px;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #d2d2d7;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1d1d1f;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 30px 0 10px;
      font-size: 13px;
      color: #86868b;
    }

    @media (max-width: 440px) {
      .container { padding: 12px; }
      header { padding: 30px 0 20px; }
      header h1 { font-size: 24px; }

      .input-group {
        flex-direction: column;
        padding: 8px;
      }

      .input-group input {
        padding: 14px 12px;
        font-size: 16px;
      }

      .input-group button {
        padding: 14px;
        width: 100%;
        border-radius: 12px;
      }

      .result-url {
        padding: 14px;
      }

      .result-url a {
        font-size: 15px;
      }

      .qr-actions {
        flex-direction: column;
      }

      .qr-actions button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Shurl</h1>
      <p>Paste a link, get a short one</p>
    </header>

    <div class="input-group">
      <input id="longUrl" type="url" placeholder="https://example.com/very-long-url" autocomplete="off" />
      <button id="shortenBtn">Shorten</button>
    </div>

    <div id="result" class="result-card">
      <div class="result-url">
        <a id="shortLink" href="#" target="_blank"></a>
        <button id="copyBtn" class="btn-copy">Copy</button>
      </div>
      <div class="qr-section">
        <img id="qrImg" src="" alt="QR Code" width="220" height="220" />
        <div class="qr-actions">
          <button id="downloadQr" class="btn-secondary">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Save QR
          </button>
          <button id="shareBtn" class="btn-secondary">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Share
          </button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading" style="display:none">Shortening</div>

    <footer>Made by PVLM</footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  const API_URL = '/api/shorten';

  const longUrlEl = document.getElementById('longUrl');
  const shortenBtn = document.getElementById('shortenBtn');
  const resultEl = document.getElementById('result');
  const shortLink = document.getElementById('shortLink');
  const copyBtn = document.getElementById('copyBtn');
  const qrImg = document.getElementById('qrImg');
  const downloadQr = document.getElementById('downloadQr');
  const shareBtn = document.getElementById('shareBtn');
  const loadingEl = document.getElementById('loading');
  const toastEl = document.getElementById('toast');

  let currentUrl = '';

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function ensureProtocol(url) {
    if (!/^https?:\/\//i.test(url)) {
      return 'https://' + url;
    }
    return url;
  }

  shortenBtn.addEventListener('click', async () => {
    let longUrl = longUrlEl.value.trim();
    if (!longUrl) { longUrlEl.focus(); return; }

    longUrl = ensureProtocol(longUrl);
    longUrlEl.value = longUrl;

    loadingEl.style.display = '';
    resultEl.classList.remove('show');
    shortenBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ longUrl })
      });
      const data = await res.json();

      if (data.shortUrl) {
        currentUrl = data.shortUrl;
        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&data=${encodeURIComponent(data.shortUrl)}`;
        resultEl.classList.add('show');

        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      } else {
        throw new Error(data.error || 'Failed');
      }
    } catch (err) {
      showToast('Error: ' + err.message);
    } finally {
      loadingEl.style.display = 'none';
      shortenBtn.disabled = false;
    }
  });

  longUrlEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') shortenBtn.click();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentUrl);
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      showToast('Copied to clipboard');
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 2000);
    } catch {
      showToast('Copy failed');
    }
  });

  downloadQr.addEventListener('click', async () => {
    try {
      const res = await fetch(qrImg.src);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qr-' + currentUrl.split('/').pop() + '.png';
      a.click();
      URL.revokeObjectURL(url);
      showToast('QR saved');
    } catch {
      showToast('Download failed');
    }
  });

  shareBtn.addEventListener('click', async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Short URL', url: currentUrl });
      } catch {}
    } else {
      await navigator.clipboard.writeText(currentUrl);
      showToast('Link copied to share');
    }
  });
  </script>
</body>
</html>
